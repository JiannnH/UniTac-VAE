[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unitac-vae"
version = "1.0.0"
description = "UniTac-VAE: a depth-aligned latent space for sensor-agnostic tactile representation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Jian Hou"}, {name = "Adam J. Spiers"}]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "h5py>=3.8",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["unitac_vae*"]
